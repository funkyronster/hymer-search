<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Hymer Technical Archive Search</title>

  <!-- Fuzzy Search Engine -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.basic.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 650px; margin: 0 auto; padding: 20px 15px; color: #222; line-height: 1.4; background-color: #fcfcfc; }
    h1 { font-size: 1.35rem; margin-bottom: 8px; color: #111; }
    .intro { font-size: 0.92rem; color: #444; margin-bottom: 16px; line-height: 1.45; }
    #searchBox { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; border: 2px solid #0066cc; border-radius: 8px; outline: none; margin-bottom: 15px; background: #fff; }
    .result-count { font-size: 0.85rem; font-weight: bold; color: #444; margin-bottom: 12px; }
    .item { padding: 12px 0; border-bottom: 1px solid #e2e2e2; }
    .item-title { font-weight: 600; font-size: 1rem; margin-bottom: 6px; color: #111; }
    .link-wrapper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .item-link { display: inline-block; background-color: #0066cc; color: #ffffff !important; text-decoration: none; padding: 7px 12px; border-radius: 6px; font-size: 0.88rem; font-weight: 500; }
    .item-link.youtube { background-color: #cc0000; }
    .item-link.external { background-color: #2b7a4b; }
    .item-link:active { opacity: 0.85; }
  </style>
</head>
<body>

  <h1>Classic Hymer Technical Archive</h1>
  <div class="intro">
    Over the years, our group has built up a massive repository of technical guides, wiring diagrams, part numbers, and troubleshooting advice. Type a keyword below to search the entire archive instantly.
  </div>

  <input type="text" id="searchBox" placeholder="Type search term (e.g. rooflight, fridge, 12V)..." autofocus>
  
  <div id="resultCount" class="result-count"></div>
  <div id="results"></div>

  <script>
    let archiveData = [];
    let fuse = null;

    fetch('master_archive.txt')
      .then(r => r.text())
      .then(text => {
        const blocks = text.split(/\n\s*\n/);
        blocks.forEach(block => {
          const lines = block.split('\n').map(l => l.trim()).filter(l => l);
          if (lines.length === 0) return;
          
          let url = null;
          let title = null;

          lines.forEach(line => {
            if (line.includes('http://') || line.includes('https://')) {
              const m = line.match(/(https?:\/\/\S+)/);
              url = m ? m[1] : line;
            } else if (!title) {
              title = line;
            }
          });

          if (title && url) {
            const searchIndex = title.toLowerCase().replace(/roof light/g, 'rooflight');
            archiveData.push({ title: title, searchIndex: searchIndex, url: url });
          }
        });

        fuse = new Fuse(archiveData, {
          keys: ['searchIndex', 'title'],
          threshold: 0.35,
          ignoreLocation: true,
          minMatchCharLength: 2
        });
      });

    const searchBox = document.getElementById('searchBox');
    const resultsContainer = document.getElementById('results');
    const resultCount = document.getElementById('resultCount');

    function getLinkMeta(url) {
      const lower = url.toLowerCase();
      if (lower.includes('facebook.com') || lower.includes('fb.com')) {
        return { label: '👉 Open Facebook Post', cssClass: '' };
      } else if (lower.includes('youtube.com') || lower.includes('youtu.be')) {
        return { label: '▶️ Open YouTube Video', cssClass: 'youtube' };
      } else {
        try {
          const parsed = new URL(url);
          const hostname = parsed.hostname.replace(/^www\./, '');
          return { label: `🌐 Open Website (${hostname})`, cssClass: 'external' };
        } catch (e) {
          return { label: '🌐 Open External Link', cssClass: 'external' };
        }
      }
    }

    searchBox.addEventListener('input', () => {
      const rawQuery = searchBox.value.trim().replace(/roof light/g, 'rooflight');
      if (!rawQuery || !fuse) {
        resultsContainer.innerHTML = '';
        resultCount.textContent = '';
        return;
      }

      const searchResults = fuse.search(rawQuery);

      resultCount.textContent = `Found ${searchResults.length} result(s)`;
      resultsContainer.innerHTML = searchResults.map(res => {
        const item = res.item;
        const meta = getLinkMeta(item.url);
        return `
          <div class="item">
            <div class="item-title">${item.title}</div>
            <div class="link-wrapper">
              <a class="item-link ${meta.cssClass}" href="${item.url}" target="_top" rel="noopener noreferrer">${meta.label}</a>
            </div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
