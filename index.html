<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Hymers Technical Archive</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      font-size: 1.6rem;
      color: #1a202c;
    }
    #searchBox {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      margin-bottom: 20px;
    }
    #searchBox:focus {
      border-color: #3182ce;
    }
    .status {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 15px;
    }
    .result-item {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 18px;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .result-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #2b6cb0;
      margin: 0 0 8px 0;
    }
    .result-content {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #4a5568;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .highlight {
      background-color: #feebc8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Classic Hymers Technical Archive</h1>
    <input type="text" id="searchBox" placeholder="Search technical database (e.g. S500 circuit diag, KZ12, EBL 99)..." autofocus>
    <div id="status" class="status">Loading archive...</div>
    <div id="results"></div>
  </div>

  <script>
    let fuse = null;
    let rawEntries = [];

    // Fetch and parse master_archive.txt
    fetch('master_archive.txt')
      .then(response => {
        if (!response.ok) throw new Error('Could not load master_archive.txt');
        return response.text();
      })
      .then(data => {
        rawEntries = parseArchive(data);
        
        fuse = new Fuse(rawEntries, {
          keys: ['title', 'content'],
          threshold: 0.4,
          ignoreLocation: true,
          useExtendedSearch: true,
          minMatchCharLength: 2
        });

        document.getElementById('status').innerText = `${rawEntries.length} technical entries loaded.`;
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Error loading archive file.';
        console.error(err);
      });

    // Parse text blocks separated by double blank lines or headers
    function parseArchive(text) {
      const blocks = text.split(/\n\s*\n\s*\n/);
      const entries = [];

      blocks.forEach((block, index) => {
        const trimmed = block.trim();
        if (!trimmed) return;

        const lines = trimmed.split('\n');
        const firstLine = lines[0].replace(/^#+\s*/, '').trim();
        const content = lines.slice(1).join('\n').trim();

        entries.push({
          id: index,
          title: firstLine || `Entry ${index + 1}`,
          content: content || trimmed
        });
      });

      return entries;
    }

    // Execute multi-word AND search
    function executeSearch(query) {
      if (!fuse || !query.trim()) {
        document.getElementById('results').innerHTML = '';
        return;
      }

      const tokens = query.trim().split(/\s+/).filter(t => t.length > 0);
      let results = [];

      if (tokens.length > 1) {
        // Build strict AND logic for multi-word searches
        results = fuse.search({
          $and: tokens.map(token => ({
            $or: [
              { title: token },
              { content: token }
            ]
          }))
        });
      } else {
        results = fuse.search(query.trim());
      }

      renderResults(results);
    }

    function renderResults(results) {
      const container = document.getElementById('results');
      if (results.length === 0) {
        container.innerHTML = '<div class="status">No matching articles found.</div>';
        return;
      }

      container.innerHTML = results.slice(0, 30).map(r => `
        <div class="result-item">
          <div class="result-title">${escapeHtml(r.item.title)}</div>
          <div class="result-content">${escapeHtml(r.item.content)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.getElementById('searchBox').addEventListener('input', (e) => {
      executeSearch(e.target.value);
    });
  </script>
</body>
</html>
