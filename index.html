<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Hymer Technical Archive Search</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 650px; margin: 0 auto; padding: 20px 15px; color: #222; line-height: 1.4; background-color: #fcfcfc; }
    h1 { font-size: 1.35rem; margin-bottom: 6px; color: #111; }
    p.intro { font-size: 0.9rem; color: #555; margin-bottom: 16px; }
    #searchBox { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px; border: 2px solid #0066cc; border-radius: 8px; outline: none; margin-bottom: 15px; background: #fff; }
    .result-count { font-size: 0.85rem; font-weight: bold; color: #444; margin-bottom: 12px; }
    .item { padding: 12px 0; border-bottom: 1px solid #e2e2e2; }
    .item-title { font-weight: 600; font-size: 1rem; margin-bottom: 8px; color: #111; }
    .item-link { display: inline-block; background-color: #0066cc; color: #ffffff !important; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; }
    .item-link:active { background-color: #004c99; }
  </style>
</head>
<body>

  <h1>Classic Hymer Technical Archive</h1>
  <p class="intro">Search our complete Facebook group technical archive by keyword.</p>

  <input type="text" id="searchBox" placeholder="Type search term (e.g. rooflight, fridge, 12V)..." autofocus>
  
  <div id="resultCount" class="result-count"></div>
  <div id="results"></div>

  <script>
    let archiveData = [];

    // Fetch master_archive.txt directly from the repository root
    fetch('master_archive.txt')
      .then(r => r.text())
      .then(text => {
        const blocks = text.split(/\n\s*\n/);
        blocks.forEach(block => {
          const lines = block.split('\n').map(l => l.trim()).filter(l => l);
          if (lines.length === 0) return;
          
          let url = null;
          let title = null;

          lines.forEach(line => {
            if (line.includes('http://') || line.includes('https://')) {
              const m = line.match(/(https?:\/\/\S+)/);
              url = m ? m[1] : line;
            } else if (!title) {
              title = line;
            }
          });

          if (title && url) {
            archiveData.push({ title: title, url: url });
          }
        });
      });

    const searchBox = document.getElementById('searchBox');
    const resultsContainer = document.getElementById('results');
    const resultCount = document.getElementById('resultCount');

    searchBox.addEventListener('input', () => {
      const rawQuery = searchBox.value.trim().toLowerCase().replace(/roof light/g, 'rooflight');
      if (!rawQuery) {
        resultsContainer.innerHTML = '';
        resultCount.textContent = '';
        return;
      }

      const terms = rawQuery.split(/\s+/);
      const matches = archiveData.filter(item => {
        const normTitle = item.title.toLowerCase().replace(/roof light/g, 'rooflight');
        return terms.every(t => normTitle.includes(t));
      });

      resultCount.textContent = `Found ${matches.length} result(s)`;
      resultsContainer.innerHTML = matches.map(item => `
        <div class="item">
          <div class="item-title">${item.title}</div>
          <a class="item-link" href="${item.url}" target="_blank" rel="noopener noreferrer">👉 Open Facebook Post</a>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
